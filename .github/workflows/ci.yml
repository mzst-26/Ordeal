name: CI

# Runs the Python tests, the JavaScript tests and the frontend build on every pull request
# and on every push to main. Netlify publishes the site from main; this workflow only checks it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests, scripts and secrets check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      # Some browser tests run `npm run build` (Vite) before they start, so this job needs Node and the npm packages too.
      # Without `npm ci`, Vite is missing and the build fails with exit status 127 ("command not found").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the npm packages for the browser tests
        run: npm ci

      # Every module under ordeal/, scripts/ and tests/ must at least compile, even the ones no test imports.
      - name: Compile every Python file
        run: python -m compileall -q ordeal scripts tests

      - name: Run the Python tests
        run: make test PYTHON=python

      - name: Check for committed secrets
        run: python scripts/check_no_secrets.py

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests import the site modules directly and need no installed packages.
      - run: npm test

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Keep the built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7
