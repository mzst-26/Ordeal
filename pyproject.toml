# Packaging for Ordeal. "pip install ." or "pipx install ." builds this project and adds the `ordeal` command.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordeal"
version = "0.1.0"
description = "Test any model for sycophancy under pressure, from the terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Only what the command line imports. matplotlib is for the charts, so it stays out.
dependencies = [
    "openai>=1.40",
    "numpy>=1.26",
]

[project.scripts]
ordeal = "ordeal.cli:main"

[tool.setuptools]
# Name the package on purpose, so the folders beside it (frontend, scripts, tests, data) are not packaged.
packages = ["ordeal"]

[tool.setuptools.package-data]
# data/ holds the platform list, the saved model list, the questions, pushback ladders and config.
# They must ship inside the installed package, so one glob covers every shared JSON file.
ordeal = ["data/*.json"]
