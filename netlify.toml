# Netlify configuration for the site. The build (Vite and React) writes the pages to dist/, and Netlify publishes that folder.

[build]
  # Vite builds the pages in frontend/ (React header, plain page modules) into dist/, which is what is published.
  command = "npm ci && npm run build"
  publish = "dist"

# Server functions for saved web runs (netlify/functions/): /api/runs and the hourly prune. They keep runs for 24 hours
# in Netlify Blobs. Anyone may save a run; each browser is capped at 100 MB, and it may delete only its own runs.
# No secret is needed.
[functions]
  directory = "netlify/functions"

# Security headers for every page and asset.
[[headers]]
  for = "/*"
  [headers.values]
    # Only load code, styles, fonts and images from this site. Scripts must be our own files, with no inline code.
    # The browser may call only the fixed API addresses of the registered providers, listed in connect-src. Each one is
    # in ordeal/data/providers.json, and a test keeps this list and that file in step. No CDN is allowed.
    # Custom model endpoints stay blocked, since their address is typed in by the user and cannot be listed here.
    # Frames, form targets and <base> are locked down to stop clickjacking and injected links.
    Content-Security-Policy = """\
      default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; \
      font-src 'self'; connect-src 'self' https://router.huggingface.co https://openrouter.ai https://api.together.xyz \
      https://api.groq.com https://api.fireworks.ai https://api.deepinfra.com https://api.cerebras.ai \
      https://api.hyperbolic.xyz https://api.novita.ai https://api.featherless.ai https://api.tokenfactory.nebius.com \
      https://oai.endpoints.kepler.ai.cloud.ovh.net https://api.mistral.ai https://dashscope-intl.aliyuncs.com \
      https://api.z.ai https://api.moonshot.ai https://api.minimax.io https://api.deepseek.com \
      https://api.scaleway.ai https://api.siliconflow.com; \
      frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"""
    # Stop browsers from guessing a file type, so a data file cannot run as a script.
    X-Content-Type-Options = "nosniff"
    # Send only the site origin, not full page paths, to other sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Turn off camera, microphone, location and payment features; the site does not use them.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Older browsers: refuse to show the site inside another page.
    X-Frame-Options = "DENY"
    # Use HTTPS only for one year, including subdomains, once a visitor has reached the site over HTTPS.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Experiment data files change when the experiment is re-exported, so they are cached for only 5 minutes.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Our own JavaScript and CSS: a short cache so that a fresh deploy reaches visitors quickly.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
